<script>
var DB = null, lists = [], idx = [];

function openDb(){
  return new Promise(function(res){
    try{
      var r = indexedDB.open('medoffers', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('lists', {keyPath:'shop'}); };
      r.onsuccess = function(){ DB = r.result; res(); };
      r.onerror = function(){ res(); };
    }catch(e){ res(); }
  });
}
function dbAll(){
  return new Promise(function(res){
    if(!DB) return res([]);
    try{
      var q = DB.transaction('lists').objectStore('lists').getAll();
      q.onsuccess = function(){ res(q.result || []); };
      q.onerror = function(){ res([]); };
    }catch(e){ res([]); }
  });
}
function dbPut(o){
  return new Promise(function(res){
    if(!DB) return res();
    try{
      var t = DB.transaction('lists','readwrite'); t.objectStore('lists').put(o);
      t.oncomplete = res; t.onerror = res;
    }catch(e){ res(); }
  });
}
function dbDel(k){
  return new Promise(function(res){
    if(!DB) return res();
    try{
      var t = DB.transaction('lists','readwrite'); t.objectStore('lists').delete(k);
      t.oncomplete = res; t.onerror = res;
    }catch(e){ res(); }
  });
}

function clean(s){ return (s||'').replace(/\s+/g,' ').replace(/[\s+*\-]+$/,'').trim(); }
function dmy(s){ var m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(s||''); return m ? m[3]+m[2]+m[1] : '00000000'; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function parseList(html, fname){
  var d = new DOMParser().parseFromString(html, 'text/html');
  var shop = '';
  var sm = /shopTitle\s*:\s*"([^"]+)"/.exec(html);
  if(sm) shop = clean(sm[1]);
  ['.shopname', 'h2', 'h3', 'h1'].forEach(function(sel){
    if(shop) return;
    var el = d.querySelector(sel), tx = el ? clean(el.textContent) : '';
    if(tx && !/^enter\b/i.test(tx) && !/^offer list$/i.test(tx)) shop = tx;
  });
  if(!shop && fname && !/^\d/.test(fname)){ shop = clean(fname.replace(/\.[^.]+$/, '').replace(/[_-]?\d{2}[-_.]\d{2}[-_.]\d{4}.*$/, '').replace(/_/g, ' ')); }
  if(/^enter customer/i.test(shop)) shop = '';
  if(!shop){ var h1 = d.querySelector('h1'); shop = clean(h1 ? h1.textContent : ''); }
  var meta = (d.body ? d.body.textContent : '') || '';
  var date = (/Date[\s:<\/b>]*(\d{2}\/\d{2}\/\d{4})/i.exec(meta) || [])[1] || '';
  var no = ((/List No[\s:]*(\d+)/i.exec(meta)) || [])[1] || '';
  var pm = /(?<!\d)(?:\+?92|0)?(3\d{2})[-\s]?(\d{7})(?!\d)/.exec(meta.slice(0, 2500));
  var ph = pm ? '0' + pm[1] + pm[2] : '';
  var wn = d.getElementById('waNumber');
  if(wn && /\d{10,}/.test(wn.value || '')) ph = wn.value.replace(/\D/g, '');
  var wm2 = /wa\.me\/\+?(\d{10,})\?text="\s*\+/.exec(html);
  if(wm2 && !(wn && /\d{10,}/.test(wn.value || ''))) ph = wm2[1];
  var items = [], comp = '';
  d.querySelectorAll('tr').forEach(function(tr){
    var tds = tr.children;
    if(tr.classList.contains('company-head') || tr.classList.contains('heading')){ comp = clean(tr.textContent).replace(/^\.+$/,''); return; }
    if(tr.classList.contains('item-row')){
      var nm = tr.querySelector('.cell-name');
      var name = clean(nm ? nm.textContent : '');
      if(!name) return;
      items.push({
        c: clean(tds[0] ? tds[0].textContent : ''), n: name, co: comp,
        d: parseFloat(tr.getAttribute('data-disc')) || 0,
        b: clean(tr.getAttribute('data-bonus') || ''),
        tp: parseFloat(tr.getAttribute('data-tp')) || 0
      });
      return;
    }
    if(tr.classList.contains('item') && tds.length >= 5){
      var n2 = clean(tds[1].textContent);
      if(!n2) return;
      items.push({
        c: clean(tds[0].textContent), n: n2, co: comp,
        d: parseFloat(tds[3].textContent) || 0,
        b: clean(tds[4].textContent),
        tp: parseFloat(tds[5] ? tds[5].textContent : '') || 0
      });
      return;
    }
    if(tr.parentNode && tr.parentNode.id === 'myTable' && tds.length === 1){ comp = clean(tr.textContent); }
  });
  var unnamed = false, sig = '';
  if(!shop){
    unnamed = true;
    sig = fname ? fname.replace(/\.[^.]+$/, '').replace(/^\d+/, '') : '';
    if(!sig) sig = 'L' + no;
    if(nameMap && nameMap[sig]){ shop = nameMap[sig]; unnamed = false; }
    else shop = 'NAAM LIKHEIN ' + sig;
  }
  return {shop: shop, date: date, no: no, ph: ph, items: items, unnamed: unnamed, sig: sig};
}

function build(){
  idx = [];
  lists.forEach(function(l){
    l.items.forEach(function(it){
      idx.push({id: idx.length, w: it.n.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean), n: it.n, k: it.n.toUpperCase().replace(/[^A-Z0-9]/g,''), l: it.n.toLowerCase(),
        co: it.co, d: it.d, b: it.b, tp: it.tp, c: it.c, shop: l.shop, date: l.date, pv: l.prev ? l.prev[it.n.toUpperCase().replace(/[^A-Z0-9]/g, '')] : null, pd: l.prevDate});
    });
  });
}

function today(){ var t = new Date(); return ''+t.getFullYear()+('0'+(t.getMonth()+1)).slice(-2)+('0'+t.getDate()).slice(-2); }

function renderMeta(){
  var total = lists.reduce(function(a,l){ return a + l.items.length; }, 0);
  document.getElementById('stat').textContent = lists.length ? ('Lagi hui lists: '+lists.length+' · Kul items: '+total) : 'Abhi koi list nahi lagi.';
  var old = lists.filter(function(l){ return dmy(l.date) < today(); }).length;
  document.getElementById('stale').innerHTML = !lists.length
    ? '<div class="warn">Pehle supplier ki offer list (.html file) lagayein, phir item search karein.</div>'
    : (old ? '<div class="warn">'+old+' lists purani hain. Taaza rate ke liye aaj ki lists dobara lagayein.</div>' : '');
  var h = '';
  lists.slice().sort(function(a,b){ return a.shop.localeCompare(b.shop); }).forEach(function(l){
    h += '<div class="lst"><div><b>'+esc(l.shop)+'</b><div class="sub">'+esc(l.date)+' · '+l.items.length+' items'+(dmy(l.date) < today() ? ' · ⚠ purani' : '')+'</div></div>'
      + '<button class="btn o s" data-del="'+esc(l.shop)+'">Hatayein</button></div>'
      + (l.unnamed ? '<div class="lst" style="flex-wrap:wrap"><input class="ph" data-rninput="1" placeholder="Is list ka supplier naam likhein"><button class="btn s" data-rname="'+esc(l.shop)+'">Naam save karein</button></div>' : '');
  });
  var lo = document.querySelector('#lists details'), wasOpen = lo ? lo.open : false;
  document.getElementById('lists').innerHTML = lists.length ? '<details'+(wasOpen ? ' open' : '')+'><summary style="font-weight:700">Lagi hui lists: '+lists.length+' · dekhein</summary>'+h+'<button class="btn o s" data-lclose="1" style="margin-top:8px">Band karein</button></details>' : '';
}

function fmtOffer(o){
  var s = '<span class="big">'+o.d.toFixed(2).replace(/\.00$/,'')+'%</span>';
  if(o.b) s += '<span class="chip">Bonus '+esc(o.b)+'</span>';
  if(o.tp > 0) s += '<div class="sub">TP Rs '+o.tp.toFixed(2).replace(/\.00$/, '')+' − '+o.d+'% = <b style="color:var(--text);font-size:16px;white-space:nowrap">Rs '+(o.tp*(1-o.d/100)).toFixed(2)+'</b></div>';
  return s;
}

function search(){
  var q = document.getElementById('q').value.toLowerCase().trim();
  var out = document.getElementById('out');
  if(!q){ out.innerHTML = lists.length ? '<div class="empty">🔍<br>Item ka naam likhein, sab se zyada discount saamne aa jayega</div>' : ''; return; }
  var toks = q.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean), groups = {}, order = [], ex = {}, dst = {};
  if(!toks.length){ out.innerHTML = ''; return; }
  var short = toks.length === 1 && toks[0].length <= 2;
  var memo = {};
  var wdm = function(t, w){ var mk = t + '|' + w, mv = memo[mk]; if(mv === undefined){ mv = wd(t, w); memo[mk] = mv; } return mv; };
  idx.forEach(function(r){
    if(short){
      if(r.n.toUpperCase().indexOf(toks[0]) !== 0) return;
      if(!groups[r.k]){ groups[r.k] = []; order.push(r.k); ex[r.k] = 0; dst[r.k] = 0; }
      groups[r.k].push(r); return;
    }
    var ws = r.w || (r.w = r.n.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean));
    var used = {}, i, j, dd2 = 0;
    for(i = 0; i < toks.length; i++){
      var bestd = -1;
      for(j = 0; j < ws.length; j++){ var d0 = wdm(toks[i], ws[j]); if(d0 >= 0){ used[j] = 1; if(bestd < 0 || d0 < bestd) bestd = d0; } }
      if(bestd < 0) return;
      dd2 += bestd;
    }
    var e = 0;
    for(j = 0; j < ws.length; j++){ if(!used[j] && !NOISE[ws[j]]) e++; }
    if(!groups[r.k]){ groups[r.k] = []; order.push(r.k); ex[r.k] = e; dst[r.k] = dd2; }
    groups[r.k].push(r);
  });
  if(!order.length){ out.innerHTML = '<div class="empty">Kuch nahi mila</div>'; return; }
  var mn = Math.min.apply(null, order.map(function(k){ return ex[k]; }));
  order.forEach(function(k){ groups[k].sort(cmpOffer); });
  var byP = function(a, b){ return short ? groups[a][0].n.localeCompare(groups[b][0].n) : cmpOffer(groups[a][0], groups[b][0]); };
  var bd = Math.min.apply(null, order.map(function(k){ return dst[k]; }));
  var cand = order.filter(function(k){ return dst[k] === bd; });
  var worse = order.filter(function(k){ return dst[k] > bd; });
  var main, rest;
  if(bd === 0){
    var mn2 = Math.min.apply(null, cand.map(function(k){ return ex[k]; }));
    main = cand.filter(function(k){ return ex[k] === mn2; }).sort(byP);
    rest = cand.filter(function(k){ return ex[k] > mn2; }).concat(worse).sort(byP);
  }else{ main = cand.sort(byP); rest = worse.sort(byP); }
  order = main.concat(showMore ? rest : []);
  var h = '', shown = 0;

async function addFiles(files){
  var msg = document.getElementById('msg'), ok = 0, skip = 0, bad = 0, badNames = [], repl = [], same = [], olds = [];
  for(var i=0;i<files.length;i++){
    msg.textContent = 'Padh raha hoon… '+(i+1)+'/'+files.length;
    try{
      var p = parseList(await files[i].text(), files[i].name || '');
      if(!p.items.length || !p.shop){ bad++; badNames.push(files[i].name || '?'); continue; }
      var ex = lists.filter(function(l){ return l.shop === p.shop; })[0];
      if(ex && dmy(ex.date) > dmy(p.date)){ skip++; olds.push(p.shop+' ('+p.date+'): pehle se '+ex.date+' ki list lagi hai'); continue; }
      if(ex && ex.date === p.date && String(ex.no) === String(p.no) && ex.items.length === p.items.length){ same.push(p.shop+' ('+p.date+')'); continue; }
      if(ex && ex.ph && !p.ph) p.ph = ex.ph;
      if(ex) repl.push(p.shop+': purani ('+ex.date+') hata kar nayi ('+p.date+') lagi');
      if(ex){
        if(dmy(ex.date) < dmy(p.date)){
          var pm2 = {};
          ex.items.forEach(function(it){ pm2[keyOf(it.n)] = {n: it.tp > 0 ? it.tp * (1 - it.d/100) : 0, d: it.d}; });
          p.prev = pm2; p.prevDate = ex.date;
        }else{ p.prev = ex.prev; p.prevDate = ex.prevDate; }
      }
      await dbPut(p);
      lists = lists.filter(function(l){ return l.shop !== p.shop; });
      lists.push(p); ok++;
    }catch(e){ bad++; badNames.push(files[i].name || '?'); }
  }
  build(); renderMeta(); search();
  var parts = [ok + ' list lagi'];
  if(repl.length) parts.push('Badli gayi (purani hata di):\n' + repl.join('\n'));
  if(same.length) parts.push('Yeh lists pehle se lagi hui thin (same list), dobara nahi lagayin. Chahein to hata sakte hain:\n' + same.join('\n'));
  if(olds.length) parts.push('Yeh purani thin, chhod di:\n' + olds.join('\n'));
  if(bad) parts.push(bad + ' file padhi nahi ja saki: ' + badNames.join(', '));
  msg.style.whiteSpace = 'pre-line';
  msg.textContent = parts.join('\n\n');
}

function lev(a, b){
  var m = a.length, n = b.length, d = [], i, j;
  for(i = 0; i <= m; i++){ d[i] = [i]; }
  for(j = 1; j <= n; j++){ d[0][j] = j; }
  for(i = 1; i <= m; i++){
    for(j = 1; j <= n; j++){
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a.charAt(i-1) === b.charAt(j-1) ? 0 : 1));
    }
  }
  return d[m][n];
}
function wd(t, w){
  if(w.indexOf(t) === 0) return 0;
  if(t.length >= 4){
    if(w.indexOf(t) > 0) return 0;
    var thr = t.length >= 7 ? 2 : 1, best = 9, L = t.length, srcs = [w, w.slice(1)];
    srcs.forEach(function(s, si){
      for(var l = L - 1; l <= L + 1; l++){
        if(l < 3) continue;
        var d = lev(t, s.slice(0, l)) + si;
        if(d < best) best = d;
      }
    });
    if(best <= thr) return best;
  }
  return -1;
}
function availFor(name){
  var toks = String(name).toUpperCase().split(/[^A-Z0-9]+/).filter(function(t){ return t.length > 1; });
  if(!toks.length) return null;
  var best = null;
  idx.forEach(function(r){
    var ws = r.w || (r.w = r.n.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean));
    for(var i = 0; i < toks.length; i++){
      var ok = false;
      for(var j = 0; j < ws.length; j++){ if(ws[j].indexOf(toks[i]) === 0){ ok = true; break; } }
      if(!ok) return;
    }
    if(!best || cmpOffer(r, best) < 0) best = r;
  });
  return best;
}

function wm(t, w){
  if(w.indexOf(t) === 0) return true;
  if(t.length >= 4){
    if(lev(t, w.slice(0, t.length)) <= (t.length >= 7 ? 2 : 1)) return true;
    if(w.indexOf(t) > 0) return true;
  }

}
function cmpOffer(a, b){

  return b.d - a.d;
}

function fixedText(title, rows, w){
  var line = new Array(w + 1).join('-');
  var out = [title.slice(0, w), new Date().toLocaleDateString('en-GB'), line];
  rows.forEach(function(r){
    var l = String(r[0]), rr = String(r[1] || '');
    var avail = rr ? w - rr.length - 1 : w;
    if(avail < 8){ avail = w; out.push(l.slice(0, avail)); l = ''; }
    while(l.length > avail){ out.push(l.slice(0, avail)); l = l.slice(avail); }
    var gap = Math.max(1, w - l.length - rr.length);
    out.push(rr ? l + new Array(gap + 1).join(' ') + rr : l);
  });
  out.push(line, 'Zeenat Medicine Market');
  return out.join('\n') + '\n\n\n';
}
function docFor(kind, key){

  return {title: title, rows: rows, text: text, fixed: fixedText(title, rows, 32)};

function keyOf(n){ return String(n).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function rebuildLast(){
  lastMap = {};
  hist.forEach(function(o){ o.items.forEach(function(it){ lastMap[it.k] = {shop: o.shop, d: o.d, qty: it.qty}; }); });

function addHist(shop, items, amt){
  if(!items.length) return;
  var tsv = 0;
  var its = items.map(function(c){
    var k = keyOf(c.n), sv = 0;
    if(c.tp > 0){
      var own = c.tp * (1 - c.d/100), ot = [];
      idx.forEach(function(r){ if(r.k === k && r.shop !== c.shop && r.tp > 0) ot.push(r.tp * (1 - r.d/100)); });
      if(ot.length){ var avg = ot.reduce(function(a, b){ return a + b; }, 0) / ot.length; sv = (avg - own) * c.qty; }
    }
    tsv += sv;
    return {n: c.n, k: k, c: c.c, qty: c.qty, d: c.d, tp: c.tp, b: c.b, sv: sv};
  });
  hist.push({shop: shop, d: new Date().toLocaleDateString('en-GB'), amt: amt, sv: tsv, items: its});
  saveHist();
}

  var added = 0, miss = 0;
  fav.forEach(function(f){
    var best = null;
    idx.forEach(function(r){ if(r.k === f.k && (!best || cmpOffer(r, best) < 0)) best = r; });

    var ex = cart.filter(function(c){ return c.shop === best.shop && c.n === best.n && c.c === best.c; })[0];

    if(Math.abs(now - p.n) < 0.005) return '';
    down = now < p.n;
    txt = 'pehle Rs ' + p.n.toFixed(2) + ' → ab Rs ' + now.toFixed(2);
  }else{

    txt = 'discount pehle ' + p.d + '% → ab ' + o.d + '%';
  }

function saveMarket(){ try{ localStorage.setItem('mo_market', JSON.stringify(market)); }catch(e){} }
function toMarket(items){
  items.forEach(function(it){
    var f = market.filter(function(m){ return m.shop === it.shop && m.n === it.n && m.c === it.c; })[0];
    if(f){ f.qty += it.qty; f.done = false; }
    else market.push({shop: it.shop, n: it.n, c: it.c, d: it.d, b: it.b, tp: it.tp, qty: it.qty, done: false});
  });
  saveMarket();
}
function mGot(c){ return c.got === undefined ? c.qty : c.got; }
function mAmt(c, q){ return c.tp > 0 ? c.tp * (1 - c.d/100) * q : 0; }
function shopDiff(s){
  var o = 0, g = 0, ch = false;
  market.forEach(function(c){ if(c.shop === s){ o += mAmt(c, c.qty); g += mAmt(c, mGot(c)); if(mGot(c) !== c.qty) ch = true; } });
  return {o: o, g: g, d: o - g, ch: ch};
}

      bt.focus(); bt.select(); bm.textContent = 'Backup ban gaya. Ab Copy dabayein.';
    }else if(t.hasAttribute('data-bkcopy')){
      var done2 = function(){ bm.textContent = 'Copy ho gaya. WhatsApp mein apne aap ko bhej dein.'; };
      try{ navigator.clipboard.writeText(bt.value).then(done2, function(){ bt.select(); try{ document.execCommand('copy'); }catch(x){} done2(); }); }
      catch(x){ bt.select(); try{ document.execCommand('copy'); }catch(y){} done2(); }
    }else{
      try{
        var bd = JSON.parse(bt.value);
        if(!bd || bd.v !== 1) throw 1;
        kh = bd.kh || {}; hist = bd.hist || []; cart = bd.cart || []; market = bd.market || []; fav = bd.fav || []; if(bd.extra && bd.extra.cats){ extra = bd.extra; if(!extra.v){ extra.cats.push('Hamdard', 'Milk'); extra.v = 2; } saveExtra(); }
        saveKh(); saveHist(); saveCart(); saveMarket(); saveFav();
        lists.forEach(function(l){ if(bd.phones && bd.phones[l.shop]){ l.ph = bd.phones[l.shop]; dbPut(l); } });
        bm.textContent = 'Sab wapas aa gaya.';
      }catch(x){ bm.textContent = 'Backup ka text theek nahi hai.'; }
    }
    return;
  }
  if((a = t.getAttribute('data-xcart')) !== null){ var xi = extra.items[+a], xav = xi ? availFor(xi.n) : null; if(xav){ addToCart(xav.id, xi.qty); t.textContent = '✓ Cart mein'; } return; }
  if((a = t.getAttribute('data-xcartall')) !== null){ var xcnt = 0; extra.items.forEach(function(it){ var av2 = availFor(it.n); if(av2){ addToCart(av2.id, it.qty); xcnt++; } }); t.textContent = '✓ ' + xcnt + ' item cart mein aaye'; return; }
  if((a = t.getAttribute('data-rname')) !== null){
    var rinp = t.parentNode.querySelector('[data-rninput]'), nn = clean(rinp ? rinp.value : '').toUpperCase();
    var lo2 = lists.filter(function(x){ return x.shop === a; })[0];
    if(!nn || !lo2) return;
    var dup = lists.filter(function(x){ return x.shop === nn && x !== lo2; })[0];
    if(dup){ lists = lists.filter(function(x){ return x !== dup; }); dbDel(nn); }
    dbDel(a); lo2.shop = nn; lo2.unnamed = false;
    if(lo2.sig){ nameMap[lo2.sig] = nn; try{ localStorage.setItem('mo_names', JSON.stringify(nameMap)); }catch(e){} }
    dbPut(lo2); build(); renderMeta(); search(); return;
  }
  if((a = t.getAttribute('data-pastego')) !== null){
    var ptx = document.getElementById('pt').value, pnm = clean(document.getElementById('pn').value).toUpperCase();
    var pph = document.getElementById('pp').value.replace(/\D/g, '');
    var pr = parsePasted(ptx);
    var pmsg = document.getElementById('msg');
    if(!pr.items.length){ pmsg.textContent = 'Paste ki hui text mein items nahi mile. Poori table select karke copy karein.'; return; }
    if(!pnm) pnm = clean(pr.shop).toUpperCase();
    if(!pnm){ pmsg.textContent = 'Supplier ka naam likhein.'; return; }
    var ptd = new Date().toLocaleDateString('en-GB');
    addParsed({shop: pnm, date: pr.date || ptd, no: pr.no, ph: pph, items: pr.items});
    return;
  }
  if((a = t.getAttribute('data-lclose')) !== null){ var dd = document.querySelector('#lists details'); if(dd) dd.open = false; return; }
  if((a = t.getAttribute('data-pr')) !== null){
    var pp = a.split('|'), pd = docFor(pp[0], pp.slice(1, -1).join('|')), pm3 = pp[pp.length - 1];
    if(pm3 === 'c'){
      var ctx = pd.text, cdone = function(){ t.textContent = '✓ Copy ho gaya'; setTimeout(function(){ t.textContent = 'Text copy'; }, 1500); };
      try{ navigator.clipboard.writeText(ctx).then(cdone, cdone); }catch(x){ cdone(); }
      return;
    }
    if(pm3 === 's' || pm3 === 'r'){
      var stx = pm3 === 'r' ? pd.fixed : pd.text;
      if(navigator.share){ navigator.share({title: pd.title, text: stx}).catch(function(){}); }
      else{ try{ navigator.clipboard.writeText(stx); t.textContent = '✓ Copy ho gaya'; }catch(x){} }
    }else{ printDoc(pd.title, pd.rows, pm3 === 't'); }
    return;
  }
  if((a = t.getAttribute('data-xadd')) !== null){
    var xn = document.getElementById('xn'), xq = document.getElementById('xq');
    var xname = clean(xn ? xn.value : '');
    if(!xname) return;
    extra.items.push({cat: +a, n: xname, qty: parseInt(xq ? xq.value : '', 10) || 1, d: new Date().toLocaleDateString('en-GB')});
    saveExtra();
    var xold = extra.cats[+a];
    t.textContent = '✓ Save ho gaya'; setTimeout(function(){ t.textContent = xold; }, 1300);
    return;
  }
  if((a = t.getAttribute('data-xqd')) !== null){ if(extra.items[+a].qty > 1) extra.items[+a].qty--; saveExtra(); renderExtra(); return; }
  if((a = t.getAttribute('data-xqi')) !== null){ extra.items[+a].qty++; saveExtra(); renderExtra(); return; }
  if((a = t.getAttribute('data-xdel')) !== null){ extra.items.splice(+a, 1); saveExtra(); renderExtra(); return; }
  if((a = t.getAttribute('data-xpdf')) !== null){ printExtra(+a); return; }
  if((a = t.getAttribute('data-xcopy')) !== null){
    var xtx = extraText(+a);
    var xdone = function(){ t.textContent = '✓ Copy ho gaya'; setTimeout(function(){ t.textContent = 'Text copy'; }, 1500); };
    try{ navigator.clipboard.writeText(xtx).then(xdone, xdone); }catch(x){ xdone(); }
    return;
  }
  if((a = t.getAttribute('data-xclr')) !== null){
    if(t.getAttribute('data-sure')){ extra.items = extra.items.filter(function(it){ return it.cat !== +a; }); saveExtra(); renderExtra(); return; }
    t.setAttribute('data-sure', '1'); t.textContent = 'Pakka saaf karein?';
    setTimeout(function(){ t.removeAttribute('data-sure'); t.textContent = 'Saaf karein'; }, 3000);
    return;
  }
  if((a = t.getAttribute('data-xren')) !== null){
    try{ var xnn = prompt('Is list ka naam', extra.cats[+a]); if(xnn && xnn.trim()){ extra.cats[+a] = xnn.trim(); saveExtra(); renderExtra(); } }catch(x){}
    return;
  }
  if((a = t.getAttribute('data-hdel')) !== null){ hist.splice(+a, 1); saveHist(); renderOrders(); return; }
  if((a = t.getAttribute('data-reorder')) !== null){
    var ho = hist[+a];
    ho.items.forEach(function(it){
      var cur = idx.filter(function(r){ return r.shop === ho.shop && r.n === it.n; })[0] || it;
      var f = cart.filter(function(c){ return c.shop === ho.shop && c.n === it.n && c.c === it.c; })[0];
      if(f) f.qty += it.qty; else cart.push({shop: ho.shop, n: it.n, c: it.c, d: cur.d, b: cur.b, tp: cur.tp, qty: it.qty});
    });
    saveCart(); t.textContent = '✓ Cart mein dala'; return;
  }
  if((a = t.getAttribute('data-gdec')) !== null){ var m1 = market[+a], g1 = mGot(m1); if(g1 > 0) m1.got = g1 - 1; saveMarket(); renderMarket(); return; }
  if((a = t.getAttribute('data-ginc')) !== null){ var m2 = market[+a]; m2.got = mGot(m2) + 1; saveMarket(); renderMarket(); return; }
  if((a = t.getAttribute('data-mfix')) !== null || (a = t.getAttribute('data-msave')) !== null){
    var sd2 = shopDiff(a);
    if(sd2.d > 0.5) addKh(a, 'adj', sd2.d, 'maal kam aya');
    else if(sd2.d < -0.5) addKh(a, 'bill', -sd2.d, 'maal zyada aya');
    if(t.hasAttribute('data-msave')){ market = market.filter(function(m){ return m.shop !== a; }); }
    else{ market.forEach(function(m){ if(m.shop === a) m.qty = mGot(m); }); market = market.filter(function(m){ return m.qty > 0; }); }
    saveMarket(); renderMarket(); return;
  }
  if((a = t.getAttribute('data-tick')) !== null){ market[+a].done = !market[+a].done; saveMarket(); renderMarket(); return; }
  if((a = t.getAttribute('data-untick')) !== null){ market.forEach(function(c){ if(c.shop === a) c.done = false; }); saveMarket(); renderMarket(); return; }
  if((a = t.getAttribute('data-mdone')) !== null){ market = market.filter(function(m){ return m.shop !== a; }); saveMarket(); renderMarket(); return; }
  if((a = t.getAttribute('data-tomk')) !== null){
    toMarket(cart.filter(function(c){ return c.shop === a; }));
    cart = cart.filter(function(c){ return c.shop !== a; }); delete amtMap[a]; msgOpen = null; saveCart(); renderCart(); return;
  }
  if((a = t.getAttribute('data-z')) !== null){ setZoom(zm + (+a) * 0.1); return; }
  if((a = t.getAttribute('data-more')) !== null){ showMore = !showMore; search(); return; }
  if((a = t.getAttribute('data-ko')) !== null){ khOpen = (khOpen === a ? null : a); renderKhata(); return; }
  if((a = t.getAttribute('data-kbill')) !== null || (a = t.getAttribute('data-kpay')) !== null){
    var ki = document.getElementById('ka'), v = parseFloat(ki ? ki.value : '') || 0;
    addKh(a, t.hasAttribute('data-kbill') ? 'bill' : 'pay', v, '');
    renderKhata(); return;
  }
  if((a = t.getAttribute('data-kdel')) !== null){ var p = a.split('||'); (kh[p[0]] || []).splice(+p[1], 1); saveKh(); renderKhata(); return; }
  if((a = t.getAttribute('data-copy')) !== null){
    var txt = orderText(a), done = function(){ t.textContent = '✓ Copy ho gaya'; };
    var fb = function(){ var m = document.getElementById('mt'); if(m){ m.focus(); m.select(); try{ document.execCommand('copy'); }catch(x){} } done(); };
    try{ navigator.clipboard.writeText(txt).then(done, fb); }catch(x){ fb(); }
    return;
  }
  if((a = t.getAttribute('data-send')) !== null){ sendOrder(a); return; }
});
document.addEventListener('change', async function(e){
  var s = e.target.getAttribute && e.target.getAttribute('data-ph');
  if(s === null || s === undefined) return;
  var l = lists.filter(function(x){ return x.shop === s; })[0];
  if(l){ l.ph = e.target.value.trim(); await dbPut(l); }
});

var shopFilter = '';
function postProcess(id){
  var el = document.getElementById(id);
  if(!el) return;
  var boxes = Array.prototype.slice.call(el.children).filter(function(b){ return b.querySelector('.gh') || b.querySelector('[data-ko]'); });
  function nm(b){ var k = b.querySelector('[data-ko]'); return k ? k.getAttribute('data-ko') : b.querySelector('.gh').textContent.replace(/\s*\(\d+\)\s*$/, ''); }
  boxes.sort(function(a, b){ return nm(a).localeCompare(nm(b)); });
  var f = shopFilter.toLowerCase().trim();
  boxes.forEach(function(b){ el.appendChild(b); b.style.display = (!f || nm(b).toLowerCase().indexOf(f) >= 0) ? '' : 'none'; });
}
function savingsBox(){
  var today0 = new Date().toLocaleDateString('en-GB'), mon = today0.slice(3), days = {}, todayS = 0, monS = 0;
  hist.forEach(function(o){
    var sv = o.sv || 0;
    if(o.d === today0) todayS += sv;
    if(o.d && o.d.slice(3) === mon){ monS += sv; days[o.d] = (days[o.d] || 0) + sv; }
  });
  var h = '<div class="box"><div class="sub">Bachat (doosre suppliers ki ausat price ke muqable)</div><div class="nm">Aaj: Rs '+Math.round(todayS)+'</div><div class="big">Is mahine: Rs '+Math.round(monS)+'</div>';
  Object.keys(days).sort().reverse().forEach(function(d){ h += '<div class="lst"><div>'+esc(d)+'</div><b>Rs '+Math.round(days[d])+'</b></div>'; });
  return h + '</div>';
}
var renderOrdersBase0 = renderOrders;
renderOrders = function(){
  renderOrdersBase0();
  if(hist.length) document.getElementById('orders').insertAdjacentHTML('afterbegin', savingsBox());
};
[['renderCart', 'cart'], ['renderMarket', 'market'], ['renderKhata', 'khata'], ['renderOrders', 'orders']].forEach(function(p){
  var base = window[p[0]];
  window[p[0]] = function(){ base.apply(null, arguments); postProcess(p[1]); };
});
var showTabBase = showTab;
showTab = function(t){ showTabBase(t); document.getElementById('sfbar').hidden = ('ckmo'.indexOf(t) < 0); };
(function(){
  var sf = document.getElementById('sf');
  function now(){ ['cart', 'khata', 'market', 'orders'].forEach(function(id){ var el = document.getElementById(id); if(el && !el.hidden) postProcess(id); }); }
  sf.addEventListener('input', function(){ shopFilter = sf.value; now(); });
  sf.addEventListener('dblclick', function(){ sf.value = ''; shopFilter = ''; now(); sf.focus(); });
})();

function parsePasted(text){
  var lines = String(text).replace(/\r/g, '').split('\n');
  var items = [], comp = '', shop = '', date = '', no = '';
  var m1 = /List No\s*:\s*(\d+)/i.exec(text); if(m1) no = m1[1];
  var m2 = /Date\s*:\s*(\d{2}\/\d{2}\/\d{4})/i.exec(text); if(m2) date = m2[1];
  for(var i = 0; i < lines.length; i++){
    var ln = lines[i];
    if(!shop && /^\s*Reset Qty\s*$/i.test(ln)){
      for(var k = i + 1; k < lines.length; k++){ if(lines[k].trim()){ shop = clean(lines[k]); break; } }
    }
    var a = /^([^\t]+)\t(.*)$/.exec(ln);
    if(a && i + 2 < lines.length && /^\s*\d+\s*$/.test(lines[i + 1])){
      var b = /^\s*(-?\d+(?:\.\d+)?)%\t([^\t]*)\t(-?\d+(?:\.\d+)?)\t(-?\d+(?:\.\d+)?)\s*$/.exec(lines[i + 2]);
      if(b){
        items.push({c: clean(a[1]), n: clean(a[2]), co: comp, d: parseFloat(b[1]), b: clean(b[2]), tp: parseFloat(b[3]) || 0});
        i += 2; continue;
      }
    }
    if(ln.trim() && ln.indexOf('\t') < 0 && !/%/.test(ln) && !/^\s*[\d.]+\s*$/.test(ln)) comp = clean(ln);
  }
  return {items: items, shop: shop, date: date, no: no};
}
async function addParsed(p){
  var msgEl = document.getElementById('msg');
  msgEl.style.whiteSpace = 'pre-line';
  var ex = lists.filter(function(l){ return l.shop === p.shop; })[0], note = '';
  if(ex && dmy(ex.date) > dmy(p.date)){ msgEl.textContent = p.shop + ': pehle se ' + ex.date + ' ki nayi list lagi hai, is liye yeh purani chhod di.'; return; }
  if(ex && ex.ph && !p.ph) p.ph = ex.ph;
  if(ex){
    if(dmy(ex.date) < dmy(p.date)){
      var pm3 = {};
      ex.items.forEach(function(it){ pm3[keyOf(it.n)] = {n: it.tp > 0 ? it.tp * (1 - it.d/100) : 0, d: it.d}; });
      p.prev = pm3; p.prevDate = ex.date;
    }else{ p.prev = ex.prev; p.prevDate = ex.prevDate; }
    note = '\nPurani (' + ex.date + ') hata kar nayi lagi.';
  }
  await dbPut(p);
  lists = lists.filter(function(l){ return l.shop !== p.shop; });
  lists.push(p);
  build(); renderMeta(); search();
  msgEl.textContent = '✓ ' + p.shop + ': ' + p.items.length + ' items lage.' + note;
}
(function(){
  var pt = document.getElementById('pt'), pn = document.getElementById('pn');
  if(pt) pt.addEventListener('input', function(){ if(pn && !pn.value){ var r = parsePasted(pt.value); if(r.shop) pn.value = r.shop; } });
})();
var nameMap = {};
try{ nameMap = JSON.parse(localStorage.getItem('mo_names') || '{}'); }catch(e){ nameMap = {}; }

async function handleShared(){
  if(!/[?&]shared=/.test(location.search) || !('caches' in window)) return;
  try{
    var cache = await caches.open('share'), keys = await cache.keys(), files = [];
    keys.forEach(function(k){
      files.push({name: '', text: async function(){ var r = await cache.match(k); return r.text(); }});
    });
    if(files.length) await addFiles(files);
    for(var j = 0; j < keys.length; j++){ await cache.delete(keys[j]); }
  }catch(e){}
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('zeenat12-sw.js').catch(function(){}); }

(async function(){
  await openDb();
  lists = await dbAll();
  build(); renderMeta(); search(); cartTab(); renderFav(); renderBk(); extraTab();
  await handleShared();
})();
